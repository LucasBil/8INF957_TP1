name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image de tests
        run: docker build --target test -t hotel-tests .

      - name: Lancer les tests dans Docker
        run: |
          mkdir -p rapport
          docker run --rm -v "${{ github.workspace }}/rapport:/app/build/reports" hotel-tests

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: rapport/tests/test/